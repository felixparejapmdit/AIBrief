    <style>
      /* Painted before any CSS/JS loads so there is never a white flash. */
      html, body { margin: 0; background-color: #0b0d10; color: #e6e9ed; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        opacity: 0; animation: boot-in 300ms ease-out 450ms forwards;
        font: 500 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.22em; text-transform: uppercase; color: #c9a14a;
      }
      @keyframes boot-in { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #boot { animation: none; opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">Woodland Construction</div></div>
